<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11111e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WizardChat" />
    <title>WizardChat</title>
    <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/images/logo.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #11111e;
      }
      #loading-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #loading-shell::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading-shell">
        <svg viewBox="0 0 400 400" width="80" height="80" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(0, 40)" stroke="none">
            <polygon points="0,280 100,320 200,270 100,230" fill="#6A329F" />
            <polygon points="100,320 300,320 200,270" fill="#784CC8" />
            <polygon points="400,280 300,320 200,270 300,230" fill="#6A329F" />
            <polygon points="100,230 200,270 230,80 200,70" fill="#784CC8" />
            <polygon points="200,270 300,230 260,75 230,80" fill="#5E3079" />
            <polygon points="200,70 230,80 260,75 300,0" fill="#885EE7" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
