# Content-Security-Policy. Keep the app policy in sync with the <meta> CSP in vite.config.ts.
# The watch together player page (/youtube-player.html) loads YouTube's player script and frames its
# video, so it gets a policy that allows exactly that, and is framed by the app only.
map $uri $mudrix_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; frame-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/youtube-player\.(html|js)$ "default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'unsafe-inline'; img-src https: data:; connect-src https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'";
}

map $uri $mudrix_frame_options {
    default DENY;
    ~^/youtube-player\.(html|js)$ SAMEORIGIN;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    include /etc/nginx/snippets/security-headers.conf;

    # Vite's content-hashed build output (name-AbCd1234.ext, flat in /assets/) never changes under
    # the same name, so it can be cached forever.
    # Unhashed files in /assets/ (images, sounds, emoji from public/) live in subdirectories and
    # do not match.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be revalidated so updates are picked up.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Version check endpoint
    location = /version.txt {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
    }

    # Other static files (unhashed: desktop-controls.js, public/assets)
    # are only cached briefly.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|json|ogg|mp3|wasm|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA routing - serve index.html for all other routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /health {
        include /etc/nginx/snippets/security-headers.conf;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
