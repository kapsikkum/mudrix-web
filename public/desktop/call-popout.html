<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Mudrix</title>
    <!-- The call pop out window of Mudrix Desktop (opened by the native shell).
         Labels come from the query string; video frames and button presses go over a
         BroadcastChannel to the main window. -->
    <style>
      :root {
        --bg: #000;
        --bar: #1a1b1e;
        --fg: #f2f3f5;
        --btn: rgba(255, 255, 255, 0.1);
        --btn-hover: rgba(255, 255, 255, 0.18);
        --danger: #ed4245;
        --danger-hover: #c93b3e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.2 system-ui,
          'Segoe UI',
          -apple-system,
          'Helvetica Neue',
          Arial,
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      .root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      canvas[hidden] {
        display: none;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
      }
      .empty[hidden] {
        display: none;
      }
      .bar {
        flex: none;
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        background: var(--bar);
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: var(--btn);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        background: var(--btn-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 1px;
      }
      button.danger {
        background: var(--danger);
        color: #fff;
      }
      button.danger:hover {
        background: var(--danger-hover);
      }
      button.muted {
        background: var(--danger);
        color: #fff;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #micOff {
        display: none;
      }
      .muted #mic {
        display: none;
      }
      .muted #micOff {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="stage">
        <canvas id="video" hidden></canvas>
        <div class="empty" id="empty">No video</div>
      </div>
      <div class="bar">
        <button type="button" id="mute">
          <svg id="mic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
          <svg id="micOff" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4l16 16" />
            <path d="M9 9v2a3 3 0 0 0 5 2.2M15 9V6a3 3 0 0 0-5.7-1.3" />
            <path d="M5 11a7 7 0 0 0 11 5.7M19 11a7 7 0 0 1-.5 2.6M12 18v3" />
          </svg>
        </button>
        <button type="button" id="back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5v14h14M5 19L19 5M12 5h7v7" />
          </svg>
        </button>
        <button type="button" id="hangup" class="danger">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 14c5-5 13-5 18 0l-2.5 2.5-3-1.5v-2.5a10 10 0 0 0-7 0V15l-3 1.5z" />
          </svg>
        </button>
      </div>
    </div>
    <script src="call-popout.js"></script>
  </body>
</html>
