# Test homeserver for dev/test-server. Not for production: open registration with a known token.
# __HOST__ is filled in by up.mjs.
[global]
server_name = "mudrix.test"
address = ["0.0.0.0"]
port = 6167
database_path = "/var/lib/tuwunel"

allow_registration = true
registration_token = "mudrix-test"
allow_encryption = true
allow_federation = true
new_user_displayname_suffix = ""
default_room_version = "11"
ip_range_denylist = []

[global.well_known]
client = "http://__HOST__:6167"

# MatrixRTC focus for Element Call (MSC4143).
[[global.well_known.rtc_transports]]
type = "livekit"
livekit_service_url = "http://__HOST__:8090"
