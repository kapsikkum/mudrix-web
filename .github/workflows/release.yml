name: Release (web)

# Tag-triggered: push v26.10.3 and this builds the web client, attaches
# mudrix-web-<version>.zip to a GitHub Release and pushes a Docker image to GHCR.
# A tag with a -next/-rc/-beta suffix is published as a pre-release (and its Docker image
# is not tagged `latest`). The desktop app is built from the separate mudrix-desktop repo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
      docker:
        description: 'Also push the Docker image to GHCR'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The release notes are written from the commits since the previous tag
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Tag matches package.json
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$RELEASE_VERSION" ]; then
            echo "package.json is $pkg but the release is $RELEASE_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Element Call is built from our fork (the mudrix-web/element-call submodule) with pnpm.
      - run: corepack enable pnpm
      - run: npm ci

      # The "What's new" dialog shows whatsnew/<version>.md, built here from the feat/fix commits
      # since the last release, so it ships inside this build. The same text is the release body.
      - name: Write the release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          touch release-notes.md
          # Missing notes must never fail a release: the build just ships without a dialog.
          node scripts/release-notes.mjs "$RELEASE_VERSION" --body release-notes.md \
            || echo "::warning::could not write the release notes"
          {
            echo "## Mudrix Web $RELEASE_VERSION"
            echo
            echo "\`mudrix-web-$RELEASE_VERSION.zip\` is the static client: serve it from any web"
            echo "server with an SPA fallback to \`index.html\` (see \`nginx.conf\`). A Docker image is published to"
            echo "\`ghcr.io/$GITHUB_REPOSITORY\`. The desktop app lives in kapsikkum/mudrix-desktop."
            echo
            cat release-notes.md
          } > release-body.md

      # The Docker job builds from a fresh checkout, so it gets the notes from here.
      - uses: actions/upload-artifact@v4
        with:
          name: whatsnew
          path: whatsnew/
          if-no-files-found: ignore

      - run: npm run build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

      - name: Package dist
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          v="$RELEASE_VERSION"
          (cd dist && zip -qr "../mudrix-web-$v.zip" .)
          sha256sum "mudrix-web-$v.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mudrix-web
          path: |
            mudrix-web-*.zip
            SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            mudrix-web-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body_path: release-body.md

  docker:
    needs: dist
    # Optional: runs on tags and when asked for explicitly.
    if: startsWith(github.ref, 'refs/tags/') || inputs.docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The "What's new" notes from the dist job; the Dockerfile copies the whole context into the
      # build. Without them (none written, or the download fails) the image just has no dialog.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: whatsnew
          path: whatsnew
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.dist.outputs.version }}
            type=raw,value=latest,enable=${{ needs.dist.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIPHY_API_KEY=${{ secrets.VITE_GIPHY_API_KEY }}
            VITE_KLIPY_API_KEY=${{ secrets.VITE_KLIPY_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
