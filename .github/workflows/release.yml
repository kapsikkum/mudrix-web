name: Release (web)

# Tag-triggered: push v26.10.3 and this builds the web client, attaches
# mudrix-web-<version>.zip to a GitHub Release and pushes a Docker image to GHCR.
# A tag with a -next/-rc/-beta suffix is published as a pre-release (and its Docker image
# is not tagged `latest`). The desktop app is built from the separate mudrix-desktop repo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
      docker:
        description: 'Also push the Docker image to GHCR'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Work out the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Tag matches package.json
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$RELEASE_VERSION" ]; then
            echo "package.json is $pkg but the release is $RELEASE_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Element Call is built from our fork (the mudrix-web/element-call submodule) with pnpm.
      - run: corepack enable pnpm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}

      - name: Package dist
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          v="$RELEASE_VERSION"
          (cd dist && zip -qr "../mudrix-web-$v.zip" .)
          sha256sum "mudrix-web-$v.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mudrix-web
          path: |
            mudrix-web-*.zip
            SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            mudrix-web-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Mudrix Web ${{ steps.version.outputs.value }}

            `mudrix-web-${{ steps.version.outputs.value }}.zip` is the static client: serve it from any web
            server with an SPA fallback to `index.html` (see `nginx.conf`). A Docker image is published to
            `ghcr.io/${{ github.repository }}`. The desktop app lives in kapsikkum/mudrix-desktop.

  docker:
    needs: dist
    # Optional: runs on tags and when asked for explicitly.
    if: startsWith(github.ref, 'refs/tags/') || inputs.docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.dist.outputs.version }}
            type=raw,value=latest,enable=${{ needs.dist.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIPHY_API_KEY=${{ secrets.VITE_GIPHY_API_KEY }}
            VITE_KLIPY_API_KEY=${{ secrets.VITE_KLIPY_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
