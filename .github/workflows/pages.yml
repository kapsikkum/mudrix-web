name: Deploy to GitHub Pages

# Publishes the web client at https://<owner>.github.io/mudrix-web/ on every release tag
# (or manually). Pages must be enabled with Source = "GitHub Actions" in the repo settings.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The release notes are written from the commits since the previous tag
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Element Call is built from our fork (the mudrix-web/element-call submodule) with pnpm.
      - run: corepack enable pnpm
      - run: npm ci
      - run: npm run build:element-call
      # The "What's new" dialog shows whatsnew/<version>.md. Missing notes never fail the build.
      - name: Write the release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v=$(node -p "require('./package.json').version"); fi
          node scripts/release-notes.mjs "$v" || echo "::warning::could not write the release notes"
      - run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
      # Deep links (/mudrix-web/r/...) have no file on disk; serving index.html as 404.html
      # lets the client router handle them.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
