# Security headers, included from every location in nginx.conf: add_header in a location block
# replaces (does not extend) the headers inherited from the server block.
add_header Content-Security-Policy $mudrix_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options $mudrix_frame_options always;
# Calls (Element Call) need the camera, microphone and screen capture; same-origin only.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
